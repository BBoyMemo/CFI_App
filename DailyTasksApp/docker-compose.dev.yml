# Local development database for Daily Tasks.
# Its own container, port and volume - nothing shared with any other project.
#   docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: dailytasks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dailyTasksDb
      POSTGRES_USER: dailytasks
      POSTGRES_PASSWORD: dailytasks_dev
    ports:
      - "5435:5432"
    volumes:
      - dailytasks-db-data:/var/lib/postgresql/data

volumes:
  dailytasks-db-data:
