# Production topology: api + postgres + nginx, one command to bring the whole stack up.
#
# This is the deployable shape, separate from local development - dev already runs
# against the `local-dev-db` container documented in README.md. Real secrets belong in a
# `.env` file next to this one (copy .env.example, never commit the real values) or in
# whatever secret store the host provides; nothing sensitive has a default here.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cfiAppDb}
      POSTGRES_USER: ${POSTGRES_USER:-cfiapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfiapp} -d ${POSTGRES_DB:-cfiAppDb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ./backend
      dockerfile: src/CfiApp.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-cfiAppDb};
        Username=${POSTGRES_USER:-cfiapp};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env - generate with: openssl rand -base64 64}
      Jwt__Issuer: ${JWT_ISSUER:-cfi-app}
      Jwt__Audience: ${JWT_AUDIENCE:-cfi-app}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:?WEB_ORIGIN must be set in .env, e.g. https://app.example.com}
      # Migrations are applied as a deliberate one-off step (see README "Deploy"), never
      # automatically on container start - a factory floor mid-shift is not the moment to
      # find out a migration locked a table.
      Database__ApplyMigrationsOnStartup: "false"
      Database__RunSeedOnStartup: "false"
    volumes:
      - api-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - web-dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
  api-storage:
  # Populated by the web build (Phase 4/9); nginx serves it as static files once that
  # build step exists. Empty for now, which nginx.conf's web location falls back on.
  web-dist:
