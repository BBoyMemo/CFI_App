# Reverse proxy: terminates TLS, serves the built web app as static files, forwards
# /api and /health to the backend container. Real certificates go in ./nginx/certs -
# obtained via certbot/Let's Encrypt once the site has a real domain (Faz 10 open item).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Real client IP behind the proxy, so the API's own rate limiting (partitioned by
    # RemoteIpAddress) sees the actual caller rather than this container every time.
    real_ip_header X-Forwarded-For;

    server {
        listen 80;
        server_name _;

        # Health checks and ACME challenges stay on plain HTTP; everything else moves to
        # HTTPS once a certificate exists.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # Placeholder paths - populated once Let's Encrypt issues the first certificate.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 12m; # matches UploadPolicy.MaxFileSizeBytes (10 MB) plus headroom

        location /api/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
        }

        # The built web app (Faz 4/9). Falls back to index.html for client-side routing;
        # until that build exists this directory is empty and nginx serves a 404, which is
        # expected - the API and its health checks are already reachable through this proxy.
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
